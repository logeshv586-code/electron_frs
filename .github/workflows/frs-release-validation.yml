name: FRS Production Validation

on:
  push:
    branches:
      - prod/frs-accuracy-light-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frs-production-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply current recognition hardening
        run: |
          # Foundational production source is already committed. Current hardeners are
          # idempotent and are re-run to guarantee the release branch invariants.
          python scripts/harden_live_recognition.py
          python scripts/harden_gallery_evidence.py
          python scripts/harden_person_lifecycle.py

      - name: Remove tracked runtime and biometric data
        shell: bash
        run: |
          git rm -r --ignore-unmatch backend_face/data backend_face/captured_faces
          if git ls-files backend_face/data backend_face/captured_faces | grep -q .; then
            echo 'Runtime data is still tracked.'
            exit 1
          fi

      - name: Verify Python syntax
        run: python -m compileall -q backend_face scripts

      - name: Install recognition test dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==1.26.4

      - name: Run production guardrail tests
        run: |
          python -m unittest backend_face.tests.test_production_guardrails
          python -m unittest backend_face.tests.test_recognition_integrity

      - name: Check source whitespace
        run: git diff --check

      - name: Synchronize npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build React production application
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Verify production integrations
        shell: bash
        run: |
          grep -q 'data-accent' frontend/src/components/layout/MainLayout.js
          grep -q 'Sapphire' frontend/src/components/layout/MainLayout.js
          grep -q 'REFERENCE_ONLY' frontend/src/components/camera/AddCameraForm.js
          grep -q 'line_x1' frontend/src/components/camera/AddCameraForm.js
          grep -q 'AuthenticatedImage' frontend/src/components/PersonCard.js
          grep -q 'FRS_ARCFACE_MODEL_PATH' backend_face/recognition/arcface.py
          grep -q 'vector_cosine_ops' backend_face/recognition/vector_store.py
          grep -q 'delete_person_vectors' backend_face/recognition/vector_store.py
          grep -q "LOWER(COALESCE(p.status,'active'))='active'" backend_face/recognition/vector_store.py
          grep -q 'invalidate_person_tracking' backend_face/face_pipeline.py
          grep -q 'delete_person_vectors' backend_face/registration/reg.py
          grep -q 'invalidate_face_bank' backend_face/registration/reg.py
          grep -q 'FRS_LIVENESS_MODEL_PATH' backend_face/recognition/liveness.py
          grep -q 'update_track_direction' backend_face/face_pipeline.py
          grep -q 'FRS_EVIDENCE_STORAGE' backend_face/storage/evidence_store.py
          grep -q 'REDIS_URL' backend_face/cache/redis_cache.py
          grep -q 'dedupe_face_detections' backend_face/face_pipeline.py
          grep -q 'update_track_identity' backend_face/face_pipeline.py
          grep -q 'suppress_overlapping_results' backend_face/face_pipeline.py
          grep -q 'evidence_score' backend_face/camera_management/streaming.py
          grep -q 'DETECTION_MIN_CONFIDENCE' backend_face/face_pipeline.py
          grep -q 'KNOWN_IMAGE_INTERVAL_SECONDS' backend_face/face_pipeline.py
          grep -q 'identity_key=item\["name"\]' backend_face/face_pipeline.py
          grep -q 'identity_key=cluster_key' backend_face/face_pipeline.py
          grep -q '_camera_name_for_stream' backend_face/face_pipeline.py
          grep -q 'FRS_ENABLE_PUBLIC_BIOMETRIC_STATIC' backend_face/main.py
          grep -q 'FRS_ENABLE_LEGACY_MATCHING' backend_face/main.py
          ! grep -q 'allow_origins=\["\*"\]' backend_face/main.py
          ! grep -q 'login-background-video' frontend/src/components/auth/AnimatedLoginPage.js
          ! grep -q 'Nexus Cyberpunk' frontend/src/components/layout/MainLayout.js

      - name: Commit finalized validated source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git config user.name 'frs-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: finalize validated FRS production source'
          git push origin HEAD:prod/frs-accuracy-light-ui
