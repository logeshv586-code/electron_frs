name: FRS Production Validation

on:
  push:
    branches:
      - prod/frs-accuracy-light-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frs-production-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply deterministic source fixes
        run: python scripts/finalize_frs_source.py

      - name: Remove tracked runtime and biometric data
        shell: bash
        run: |
          git rm -r --ignore-unmatch backend_face/data backend_face/captured_faces
          if git ls-files backend_face/data backend_face/captured_faces | grep -q .; then
            echo 'Runtime data is still tracked.'
            exit 1
          fi

      - name: Verify Python syntax
        run: python -m compileall -q backend_face scripts

      - name: Check source whitespace
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build React production application
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Verify light product design guardrails
        shell: bash
        run: |
          grep -q 'data-accent' frontend/src/components/layout/MainLayout.js
          grep -q 'Sapphire' frontend/src/components/layout/MainLayout.js
          grep -q 'REFERENCE_ONLY' frontend/src/components/camera/AddCameraForm.js
          grep -q 'AuthenticatedImage' frontend/src/components/FaceGallery.js
          ! grep -q 'login-background-video' frontend/src/components/auth/AnimatedLoginPage.js
          ! grep -q 'Nexus Cyberpunk' frontend/src/components/layout/MainLayout.js

      - name: Commit finalized validated source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git config user.name 'frs-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: finalize validated FRS production source'
          git push origin HEAD:prod/frs-accuracy-light-ui
